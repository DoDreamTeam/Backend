name: BACK-WORKFLOW
on:
  push:
    branches: [ "dev" ]
jobs:
  back-job:
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd /home/ubuntu/dodream-back/Backend
            mkdir -p src/main/resources
            cat <<EOF > src/main/resources/application.yml
            spring:
              application:
                name: backend
              datasource:
                driver-class-name: com.mysql.cj.jdbc.Driver
                url: ${{ secrets.MYSQL_URL }}
                username: ${{ secrets.MYSQL_USERNAME }}
                password: ${{ secrets.MYSQL_PASSWORD }}
              jpa:
                open-in-view: false
                hibernate:
                  ddl-auto: none
                properties:
                  hibernate:
                    show_sql: true
                    format_sql: true
                  dialect: org.hibernate.dialect.MySQL8InnoDBDialect
                defer-datasource-initialization: true
                generate-ddl: true
                show-sql: true
            
              sql:
                init:
                  mode: never
              cache:
                type: redis
              data:
                jpa:
                  repositories:
                    bootstrap-mode: deferred
                redis:
                  repositories:
                    enabled: false
                  host: ${{ secrets.REDIS_HOST }}
                  port: ${{ secrets.REDIS_PORT }}
                  timeout: 6
            
            cloud:
              aws:
                s3:
                  bucket: ${{ secrets.S3_BUCKET }}
                credentials:
                  access-Key: ${{ secrets.ACCESS_KEY }}
                  secret-Key: ${{ secrets.SECRET_KEY }}
                region:
                  static: ap-northeast-2
                stack:
                  auto: false
            
            jwt:
              issuer: ${{ secrets.JWT_ISSUER }}
              secret_key: ${{ secrets.JWT_KEY }}
              access_duration: 1800000 # 1800000  # 30분 (30 * 60 * 1000)
              refresh_duration: 86400000 # 86400000 # 24시간 (24 * 60 * 60 * 1000)
            
            oauth2:
              clients:
                google:
                  client-id: ${{ secrets.GOOGLE_ID }}
                  client-secret: ${{ secrets.GOOGLE_KEY }}
                  redirect-uri: ${{ secrets.GOOGLE_REDIRECT_URI }}
                  token-uri: https://oauth2.googleapis.com/token
                  user-info-request-uri: https://www.googleapis.com/oauth2/v3/userinfo
                kakao:
                  client-id: ${{ secrets.KAKAO_ID }}
                  client-secret: ${{ secrets.KAKAO_KEY }}
                  redirect-uri: ${{ secrets.KAKAO_REDIRECT_URI }}
                  token-uri: https://kauth.kakao.com/oauth/token
                  user-info-request-uri: https://kapi.kakao.com/v2/user/me
                naver:
                  client-id: ${{ secrets.NAVER_ID }}
                  client-secret: ${{ secrets.NAVER_KEY }}
                  redirect-uri: ${{ secrets.NAVER_REDIRECT_URI }}
                  token-uri: https://nid.naver.com/oauth2.0/token
                  user-info-request-uri: https://openapi.naver.com/v1/nid/me

            git_output=$(sudo git pull origin dev 2>&1)
            
            docker compose up -d --build

      - name: slack-notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: ${{ steps.get_author_name.outputs.author_name }}
          fields: repo,commit,message,author # action,eventName,ref,workflow,job,took 추가할 수 있음
          mention: here
          if_mention: failure,cancelled
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # required
        if: always() # Pick up events even if the job fails or is canceled.
